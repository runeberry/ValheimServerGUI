name: mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]

concurrency:
  group: mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: https://forge.nuffle.dev/homelab/act-runner/actions/mirror@main
        with:
          targets: |
            forge:runeberry/ValheimServerGUI
            github:runeberry/ValheimServerGUI
