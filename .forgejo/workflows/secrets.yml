name: secrets

on:
  push:
    branches: [main]
    paths:
      - ".forgejo/secrets.toml"
      - ".forgejo/workflows/secrets.yml"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    enable-openid-connect: true
    steps:
      - uses: actions/checkout@v4
      - uses: https://forge.nuffle.dev/homelab/act-runner/actions/secrets-sync@main
