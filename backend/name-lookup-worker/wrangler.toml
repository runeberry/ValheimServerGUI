# Cloudflare Worker config for the VSG name-lookup backend.
#
# Before first deploy (see README.md):
#   1. Create the KV namespace and paste its id below:
#        wrangler kv namespace create NAME_CACHE
#   2. Set the upstream + client secrets (never commit these):
#        wrangler secret put STEAM_API_KEY
#        wrangler secret put OPENXBL_API_KEY
#        wrangler secret put CLIENT_API_KEY     # must equal ClientSecrets.RuneberryClientApiKey in the app
#   3. wrangler deploy
name = "vsg-name-lookup"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# The HTTP header the app sends its client API key in (ClientSecrets.RuneberryApiKeyHeader).
# The key VALUE itself is a secret (CLIENT_API_KEY), set via `wrangler secret put`.
[vars]
API_KEY_HEADER = "x-runeberry-api-key"

# KV namespace for platform:playerId -> display-name caching. Fill in `id` after creating it (step 1).
[[kv_namespaces]]
binding = "NAME_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
