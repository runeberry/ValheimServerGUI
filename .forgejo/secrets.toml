# Secrets this repository declares (homelab act-runner actions secrets-sync / secrets).

[secrets.RUNEBERRY_API_KEY_HEADER]
provider = "manual"
account = "manual"
rotation_period = "never"
notes = "runeberry API key header name, baked into release builds"

[secrets.RUNEBERRY_CLIENT_API_KEY]
provider = "manual"
shared = "arcanum/ValheimServerGUI.Api/CLIENT_API_KEY"

[secrets.CS_SIGNER_KEY]
provider = "manual"
shared = "arcanum/code-signing/CS_SIGNER_KEY"

[secrets.FORGE_MIRROR_TOKEN]
provider = "manual"
shared = "homelab/act-runner/FORGE_MIRROR_TOKEN"

[secrets.GH_MIRROR_TOKEN]
provider = "manual"
shared = "homelab/act-runner/GH_MIRROR_TOKEN"
